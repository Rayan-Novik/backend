worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Otimizacoes de Desempenho e Limite de Upload (XMLs de NFe, Certificados, Imagens)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Compressao Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # DNS Interno do Docker (Permite resolver containers dinamicamente sem travar na inicializacao)
    resolver 127.0.0.11 valid=15s ipv6=off;

    # ==================================================================================
    # 1. ADMIN (Painel Administrativo do Lojista)
    # ==================================================================================
    server {
        listen 80;
        server_name admin.azun.com.br admin.ararinhacloud.shop;

        location / {
            set $admin_upstream http://admin-app:80;
            proxy_pass $admin_upstream;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
        }

        # Desafio Let's Encrypt para renovacao de SSL
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

    # ==================================================================================
    # 2. BACKEND / API (Node.js Express + Emissor Fiscal PHP + WebSockets)
    # ==================================================================================
    server {
        listen 80;
        server_name back.ararinhacloud.shop api.azun.com.br;

        location / {
            set $backend_upstream http://backend:5000;
            proxy_pass $backend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 15s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

    # ==================================================================================
    # 3. TENANTS / FRONTEND CLIENTES (Catch-all para Lojas Virtuais e Dominios Personalizados)
    # ==================================================================================
    server {
        listen 80 default_server;
        server_name _;

        # Rota de Renderizacao OpenGraph (Roteada para a API)
        location /api/public/render-og {
            set $backend_upstream http://backend:5000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rota Principal da Loja / Frontend dos Clientes
        location / {
            set $frontend_upstream http://frontend-app:80;
            proxy_pass $frontend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }
}
