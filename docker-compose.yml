version: '3.8'
services:
  # 1. O SEU BANCO DE DADOS
  mysql:
    image: mysql:8.0
    container_name: ararinha_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Gd1700al@@
      MYSQL_DATABASE: ecommerce_db
    ports:
      - "3307:3306" # 🟢 MUDAMOS PARA 3307 PARA EVITAR CONFLITO COM HOST
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psenha"]
        interval: 10s
        timeout: 5s
        retries: 10

  # 2. O SEU PAINEL PHP MY ADMIN
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ararinha_phpmyadmin
    restart: always
    ports:
      - "8081:80" # 🟢 MUDAMOS PARA 8081 PORQUE A 8080 ESTÁ NO WUZAPI
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: Gd1700al@@
    depends_on:
      - mysql

  # 3. A SUA API BACKEND
  backend:
    build: .
    container_name: ararinha_backend
    restart: always
    ports:
      - "5005:5000" # 🟢 MUDAMOS A PORTA EXTERNA PARA 5005 POR SEGURANÇA
    depends_on:
      mysql:
        condition: service_healthy 
    env_file:
      - .env

volumes:
  mysql_data: